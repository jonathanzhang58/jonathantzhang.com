<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Recording</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #fdfdfc;
      --ink: #17181c;
      --font: Arial, Helvetica, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1724; --ink: #f3ecdc; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 28px;
    }
    p {
      margin: 0;
      max-width: 34ch;
      font-size: clamp(20px, 3.4vw, 28px);
      line-height: 1.55;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <p>Please check back ~24 hours after the meeting has occurred to access the Parkinson&rsquo;s Pals recording.</p>
</body>
</html>
